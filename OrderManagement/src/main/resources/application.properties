spring.application.name=OrderManagement

spring.config.import=configserver:http://localhost:8888

management.endpoints.web.exposure.include=*

resilience4j.circuitbreaker.instances.orderCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.orderCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.orderCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderCB.wait-duration-in-open-state=10
resilience4j.circuitbreaker.instances.orderCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.orderCB.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.orderCB.minimum-number-of-calls=3